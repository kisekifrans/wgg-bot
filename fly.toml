# Fly.io app config — WGG Discord Ticket Bot
# Docs: https://fly.io/docs/reference/configuration/

app = 'wgg-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  START_LEGACY_DASHBOARD = 'false'
  PORT = '8080'
  NODE_OPTIONS = '--dns-result-order=ipv4first'

# Keep machine running 24/7 (required for Discord bot)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '90s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[processes]
  app = 'node index.js'
