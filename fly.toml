# fly.toml app configuration file generated for wgg-bot on 2026-06-06T05:16:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wgg-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  START_LEGACY_DASHBOARD = 'false'

[processes]
  app = 'node index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
